# Incident Copilot - CI/CD Deploy to LKE (optional)
# Trigger: manual or on push to main
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
        if: ${{ secrets.KUBECONFIG != '' }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install incident-copilot ./helm \
            -n incident-copilot --create-namespace \
            -f ./helm/values.yaml \
            -f ./deploy/envs/${{ github.event.inputs.environment || 'dev' }}.yaml \
            --set imageTag=${{ github.event.inputs.environment || 'dev' }} \
            --wait --timeout 5m
        if: ${{ secrets.KUBECONFIG != '' }}
