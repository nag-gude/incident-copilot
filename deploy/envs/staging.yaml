# Incident Copilot - Staging Environment
environment: staging
imageTag: staging
imagePullPolicy: Always

ingestion:
  replicaCount: 1
anomaly:
  replicaCount: 1
prediction:
  replicaCount: 1
recommendation:
  replicaCount: 1
knowledge:
  replicaCount: 1
apiGateway:
  replicaCount: 1

ingress:
  enabled: true
  host: incident-copilot-staging.example.com
  className: nginx
  tls:
    enabled: true

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi
