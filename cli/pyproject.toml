[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-copilot-cli"
version = "1.0.0"
description = "Incident Copilot CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.26.0",
]

[project.scripts]
incident-copilot = "main:app"

[tool.setuptools]
py-modules = ["main"]
